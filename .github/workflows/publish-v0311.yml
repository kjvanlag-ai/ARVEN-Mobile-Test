name: Publish real Godot v0.3.11

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v0311.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mobile test repository
        uses: actions/checkout@v4

      - name: Download tested v0.3.11 Godot Web artifact
        run: |
          URL='https://sdmntprnortheu.oaiusercontent.com/files/00000000-0754-81f4-9574-bb9bb542e9fc/raw?se=2026-09-28T12%3A43%3A36Z&sp=r&sv=2026-02-06&sr=b&scid=f9cbf8a4-c6aa-5eb1-941d-2baf7d3e9507&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T05%3A34%3A14Z&ske=2026-09-29T05%3A34%3A14Z&sks=b&skv=2026-02-06&sig=T%2BGfkENP9mOqS9DY3G3G7O3EmKC9y0tVboH2n%2BdFf%2Bk%3D'
          curl -L --fail --retry 3 "$URL" -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/web/index.html
          test -f artifact/web/index.wasm
          test -f artifact/web/index.pck

      - name: Replace live mobile build
        run: |
          find . -maxdepth 1 -type f -delete
          cp -a artifact/web/. .
          rm -rf artifact artifact.zip
          touch .nojekyll
          echo 'ARVEN / RELIVOR v0.3.11 — real Godot 4.7.2 Web build — rounded classic UI + HiDPI' > BUILD.txt

      - name: Commit live v0.3.11 build
        run: |
          git config user.name 'ARVEN Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish real Godot ARVEN v0.3.11 rounded mobile UI'
          git push
