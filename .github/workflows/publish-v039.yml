name: Publish real Godot v0.3.9

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-v039.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout public mobile test repository
        uses: actions/checkout@v4

      - name: Download tested v0.3.9 Godot Web artifact
        run: |
          URL='https://sdmntprdenmarkeast.oaiusercontent.com/files/00000000-9724-8210-8223-31dd9efe2368/raw?se=2026-09-28T10%3A46%3A04Z&sp=r&sv=2026-02-06&sr=b&scid=388f159f-389a-5cd2-8a59-248025b0800a&skoid=a3a8eefe-d4bd-4909-ab1d-2a75a2302fac&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-09-28T04%3A56%3A06Z&ske=2026-09-29T04%3A56%3A06Z&sks=b&skv=2026-02-06&sig=ng2PPM6CgA%2B8NSK6/ydUlsluHWFmROZZljYvaf2psjQ%3D'
          curl -L --fail --retry 3 "$URL" -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact
          test -f artifact/web/index.html
          test -f artifact/web/index.wasm
          test -f artifact/web/index.pck

      - name: Replace old browser prototype with real Godot Web build
        run: |
          find . -maxdepth 1 -type f -delete
          cp -a artifact/web/. .
          rm -rf artifact artifact.zip
          touch .nojekyll
          echo 'ARVEN / RELIVOR v0.3.9 — real Godot 4.7.2 Web build' > BUILD.txt

      - name: Commit real Web build to public test repository
        run: |
          git config user.name 'ARVEN Build Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'Publish real Godot ARVEN v0.3.9 mobile build'
          git push
